name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    # mvn test inclui SentimentE2ETest (Testcontainers: Postgres real + imagem
    # do ds-service buildada do Dockerfile do repositório, sem mock). Runners
    # ubuntu-latest já têm Docker disponível — nenhum setup extra necessário.
    # Timeout maior porque a primeira execução builda a imagem do zero
    # (instala scikit-learn etc.) sem cache de camadas entre runs.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/sentiment-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test -B

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/sentiment-backend/target/surefire-reports
          retention-days: 7

  ds-service:
    name: DS Service (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ds-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ds-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
