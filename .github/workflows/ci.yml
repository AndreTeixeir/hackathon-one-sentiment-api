name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    # mvn test inclui SentimentE2ETest (Testcontainers: Postgres real + imagem
    # do ds-service buildada do Dockerfile do repositório, sem mock). Runners
    # ubuntu-latest já têm Docker disponível — nenhum setup extra necessário.
    # Timeout maior porque a primeira execução builda a imagem do zero
    # (instala scikit-learn etc.) sem cache de camadas entre runs.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/sentiment-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test -B

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/sentiment-backend/target/surefire-reports
          retention-days: 7

  ds-service:
    name: DS Service (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ds-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ds-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  e2e-frontend:
    name: E2E Frontend (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do ds-service e subir em background
        working-directory: ds-service
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/ds-service.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done

      - name: Subir o backend em background
        working-directory: backend/sentiment-backend
        run: |
          nohup mvn spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/health && break; sleep 3; done

      - name: Instalar dependências do Node e o Chromium do Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Rodar os testes Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: |
          echo "=== backend ==="; cat /tmp/backend.log || true
          echo "=== ds-service ==="; cat /tmp/ds-service.log || true
